<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#064c48" />
    <title>NotCupid is offline</title>
    <style>
      @font-face{font-family:'Space Grotesk';src:url('/fonts/SpaceGrotesk.woff2') format('woff2');font-weight:300 700;font-display:swap}
      @font-face{font-family:'DM Sans';src:url('/fonts/DMSans.woff2') format('woff2');font-weight:100 1000;font-display:swap}
      a:focus-visible{outline:3px solid #064c48;outline-offset:4px}

      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #173c37;
        background:
          radial-gradient(circle at 82% 12%, rgba(244,197,66,0.16), transparent 32%),
          radial-gradient(circle at 8% 88%, rgba(6,76,72,0.09), transparent 34%),
          #f7f5ee;
        font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(440px, 100%);
        border: 1px solid rgba(58,39,24,0.13);
        border-radius: 26px;
        padding: 22px;
        background: rgba(255,253,248,0.92);
        box-shadow: 0 24px 70px -38px rgba(11,11,11,0.35);
      }
      img { width: 56px; height: 56px; border-radius: 16px; box-shadow: 0 12px 24px -18px rgba(11,11,11,0.5); }
      .kicker {
        margin-top: 18px;
        color: #765600;
        font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 8px 0 10px;
        font-family: "Space Grotesk", sans-serif;
        font-style: normal;
        font-weight: 650;
        font-size: clamp(30px, 10vw, 46px);
        line-height: 0.98;
        letter-spacing: -.04em;
      }
      p { margin: 0; color: #52675e; font-size: 15px; line-height: 1.55; }
      .retry {
        display: block;
        text-align: center;
        text-decoration: none;
        margin-top: 18px;
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 14px 18px;
        background: #064c48;
        color: white;
        cursor: pointer;
        font: 650 15px "DM Sans", sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <div class="kicker">NotCupid</div>
      <h1>Connection needs a signal.</h1>
      <p>You are offline right now. Come back when your connection is back and we will reopen your Hub, Love Line, Friend Line, or chat.</p>
      <a class="retry" href="">Try again</a>
    </main>
  </body>
</html>
