<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.3" fill="#e6dbc5"/>
    </pattern>
    <radialGradient id="warm" cx="30%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#fbf6ea"/>
      <stop offset="100%" stop-color="#f3ecdb"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#warm)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- ===== the place setting ===== -->
  <!-- placemat shadow -->
  <ellipse cx="478" cy="472" rx="318" ry="308" fill="#e2d5ba" opacity="0.55"/>

  <!-- plate = running track -->
  <g transform="translate(470,458)">
    <circle r="300" fill="#efe4cd"/>
    <circle r="282" fill="#c04f2c"/>
    <circle r="284" fill="none" stroke="#a53f20" stroke-width="4"/>
    <!-- lane lines -->
    <circle r="248" fill="none" stroke="#f3ecdb" stroke-width="3.5"/>
    <circle r="214" fill="none" stroke="#f3ecdb" stroke-width="3.5"/>
    <circle r="180" fill="none" stroke="#f3ecdb" stroke-width="3.5"/>
    <!-- infield = plate center -->
    <circle r="146" fill="#f3ecdb"/>
    <circle r="146" fill="none" stroke="#e0d3b6" stroke-width="2"/>
    <!-- start / finish line -->
    <line x1="146" y1="0" x2="282" y2="0" stroke="#f3ecdb" stroke-width="7"/>
    <!-- runner dot, lane 2, with motion trail -->
    <g>
      <circle cx="186" cy="-140" r="11" fill="#171310"/>
      <path d="M 214 -108 A 232 232 0 0 0 232 -32" fill="none" stroke="#171310" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 20" opacity="0.65"/>
    </g>
  </g>

  <!-- fork (left) -->
  <g fill="#221c15">
    <rect x="94" y="352" width="13" height="310" rx="6.5"/>
    <rect x="66" y="238" width="10" height="98" rx="5"/>
    <rect x="88" y="238" width="10" height="98" rx="5"/>
    <rect x="110" y="238" width="10" height="98" rx="5"/>
    <rect x="132" y="238" width="10" height="98" rx="5"/>
    <path d="M 66 322 Q 66 356 100 360 Q 136 356 142 322 L 142 306 L 66 306 Z"/>
  </g>

  <!-- knife (right) -->
  <g fill="#221c15">
    <path d="M 848 238 C 878 260 884 320 872 352 L 848 352 Z"/>
    <rect x="846" y="238" width="13" height="120" rx="6"/>
    <rect x="846" y="352" width="13" height="310" rx="6.5"/>
  </g>

  <!-- ===== title block ===== -->
  <text x="948" y="322" font-family="Helvetica, Arial, sans-serif" font-size="19" letter-spacing="4.5" fill="#a45a2a">THE RE-FORMING OF HOSPITALITY &#183; 2026</text>

  <text x="944" y="428" font-family="Georgia, serif" font-size="80" fill="#171310">Nobody drinks.</text>
  <text x="944" y="530" font-family="Georgia, serif" font-size="80" fill="#171310">Everybody <tspan fill="#c04f2c" font-style="italic">runs.</tspan></text>

  <line x1="950" y1="582" x2="1150" y2="582" stroke="#c04f2c" stroke-width="4"/>

  <text x="944" y="644" font-family="Georgia, serif" font-style="italic" font-size="29" fill="#6e6250">Hospitality isn&#8217;t dying. The third place</text>
  <text x="944" y="686" font-family="Georgia, serif" font-style="italic" font-size="29" fill="#6e6250">moved &#8212; and it sweats now.</text>
</svg>
