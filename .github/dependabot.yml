version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Test loaders require the JavaScript compiler API removed in TypeScript 7.
    ignore:
      - dependency-name: typescript-test-compiler
        update-types:
          - version-update:semver-major
    groups:
      react-stack:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      safe-patches:
        update-types:
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
