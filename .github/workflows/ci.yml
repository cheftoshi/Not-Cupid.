name: NotCupid CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: notcupid-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-placeholder
      SUPABASE_SERVICE_KEY: ci-service-placeholder
      SESSION_SECRET: ci-session-placeholder-that-is-not-used-in-production
      CRON_SECRET: ci-cron-placeholder-that-is-not-used-in-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run performance:budget

  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-placeholder
      SUPABASE_SERVICE_KEY: ci-service-placeholder
      SESSION_SECRET: ci-session-placeholder-that-is-not-used-in-production
      CRON_SECRET: ci-cron-placeholder-that-is-not-used-in-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mobile-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
